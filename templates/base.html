<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}Student Personal Predictor{% endblock %}</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎓</text></svg>">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
{% block head %}{% endblock %}
</head>
<body>
<nav>
  <a class="logo" href="/">🎓 StudentPredict</a>
  <div>
    <a href="/" class="{{ 'active' if request.path == '/' else '' }}">Predict</a>
    <a href="/history" class="{{ 'active' if request.path == '/history' else '' }}">History</a>
    <a href="/dashboard" class="{{ 'active' if request.path == '/dashboard' else '' }}">Dashboard</a>
    <a href="/help" class="{{ 'active' if request.path == '/help' else '' }}">Help</a>
    <a href="/about" class="{{ 'active' if request.path == '/about' else '' }}">About</a>
  </div>
</nav>

<main>
{% block content %}{% endblock %}
</main>

<footer>
  StudentPredict &bull; Beginner AI/ML Mini Project &bull; Developed by <a href="/about">Meraj</a>
  &bull; <a href="/admin/login">Admin</a>
</footer>

{% block scripts %}{% endblock %}
</body>
</html>
